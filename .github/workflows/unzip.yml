name: Extract VEDA ZIP

on:
  push:
    paths:
      - "veda_mvp.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Extract VEDA ZIP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y unzip
          mkdir -p /tmp/veda_zip
          unzip -q veda_mvp.zip -d /tmp/veda_zip
          cp -a /tmp/veda_zip/veda_mvp/. .
          rm -f veda_mvp.zip

      - name: Save extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract VEDA project from ZIP"
            git push
          fi
